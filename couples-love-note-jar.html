<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#FDF1F3;--c1:#F9DFE5;--c2:#F4C8D5;--c3:#E9A7BC;--c4:#D5819F;--deep:#A94F78;--dark:#7A3452;--mid:#B5587F;--w:#FFFAFB}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:Georgia,"Times New Roman",serif;color:var(--dark);display:flex;align-items:center;justify-content:center}
.c{text-align:center;padding:14px;width:100%;max-width:440px;box-sizing:border-box}
.k{font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.7}
.it{font-style:italic;font-size:16px;color:var(--mid)}
input{font-family:inherit;font-size:14px;color:var(--dark);background:var(--w);border:1px solid var(--c3);border-radius:14px;padding:7px 12px;margin:3px;flex:1 1 200px;min-width:0;outline:none}
input:focus{border-color:var(--c4)}
button{font-family:inherit;font-size:13px;border:1px solid var(--c3);background:var(--w);color:var(--dark);border-radius:20px;padding:6px 14px;margin:3px;cursor:pointer}
button.on{background:var(--c4);color:#fff;border-color:var(--c4)}
.row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
#add{display:none;margin-top:8px}
</style></head><body><div class="c">
<div class="k">love note jar</div>
<div class="it" id="p" style="font-size:20px;line-height:1.45;margin:12px 0 14px;min-height:60px">tap the jar for a note</div>
<div class="row"><button class="on" id="pull">pull a note 💌</button><button id="mineBtn">add mine</button></div>
<div class="row" id="add"><input id="t" maxlength="160" placeholder="write a love note for the jar"><button class="on" id="save">add</button></div>
<div class="it" style="font-size:12px;margin-top:8px" id="s"></div></div>
<script>
var SAVE=true; // set to false for a fully stateless widget (your notes last until the page reloads)
var mem=[];
function sv(k,v){if(!SAVE)return;try{localStorage.setItem(k,v)}catch(e){}}
function ld(k,d){if(!SAVE)return d;try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
var N=["Plan a ten minute no-phone cuddle.","Tell them one thing you noticed today that you loved.","Write a note and hide it in their bag.","Recreate your first date at home.","Cook something neither of you has tried.","Share your favorite memory of the two of you.","Take a slow walk with no destination.","Send a voice note instead of a text.","Say thank you for one small thing they did.","Make a playlist of songs that remind you of them.","Ask: what made you feel loved this week?","Plan a surprise, however small.","Take a photo together and pick a caption.","Dream out loud: where do we live in five years?","Do the dishes together with music on."];
function mine(){try{var a=JSON.parse(ld("mynotes","[]"));return a.concat(mem.filter(function(x){return a.indexOf(x)<0}))}catch(e){return mem.slice()}}
function pick(){var a=N.concat(mine());document.getElementById("p").textContent="“"+a[Math.floor(Math.random()*a.length)]+"”"}
function toggle(){var b=document.getElementById("add");var open=b.style.display!=="flex";b.style.display=open?"flex":"none";if(open)document.getElementById("t").focus()}
function addNote(){var i=document.getElementById("t"),t=i.value.trim();if(!t)return;var a=mine();a.push(t);mem.push(t);sv("mynotes",JSON.stringify(a));i.value="";document.getElementById("add").style.display="none";document.getElementById("p").textContent="“"+t+"”";document.getElementById("s").textContent="added. "+a.length+" of yours in the jar."}
document.getElementById("pull").onclick=pick;
document.getElementById("mineBtn").onclick=toggle;
document.getElementById("save").onclick=addNote;
document.getElementById("t").addEventListener("keydown",function(e){if(e.key==="Enter")addNote()});
</script></body></html>
