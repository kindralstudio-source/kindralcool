<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#F5EEE6}
body{font-family:Georgia,"Times New Roman",serif;color:#6F4E37;display:flex;align-items:center;justify-content:center}
.c{text-align:center;padding:14px;max-width:360px;width:100%;box-sizing:border-box}
.l{font-style:italic;font-size:15px;opacity:.85}
.t{font-size:46px;margin:2px 0 6px;line-height:1.1}
.s{font-size:13px;opacity:.8;margin:2px 0 8px}
button{font-family:inherit;font-size:14px;border:1px solid #C8A98B;background:#FFFDFB;color:#6F4E37;border-radius:20px;padding:6px 14px;margin:3px;cursor:pointer}
button.on{background:#B08968;color:#fff;border-color:#B08968}
input{font-family:inherit;font-size:14px;color:#6F4E37;border:1px solid #C8A98B;background:#FFFDFB;border-radius:12px;padding:6px 10px;width:100%;box-sizing:border-box;margin:3px 0}
input[type=checkbox]{width:auto;accent-color:#B08968;margin:0 8px 0 0}
.row{display:flex;gap:6px;align-items:center}
.m{font-size:12px;letter-spacing:2px;text-transform:lowercase;opacity:.7;margin-top:8px}
.bar{height:8px;border-radius:8px;background:#FFFDFB;border:1px solid #C8A98B;overflow:hidden;margin:6px 0}
.fill{height:100%;width:0;background:#B08968;transition:width .4s}
ul{list-style:none;padding:0;margin:6px 0;text-align:left}
li{padding:4px 2px;font-size:14px;display:flex;align-items:center}
li.done span{text-decoration:line-through;opacity:.55}
</style></head>
<body><div class="c">
<div class="l" id="y">this year, so far</div>
<div class="t" id="p">0%</div>
<div class="bar"><div class="fill" id="f"></div></div>
<div class="s" id="dl">days left</div>
<input id="w" placeholder="your word of the year">
<div class="m" id="wm">a gentle year, beautifully planned</div>
</div>
<script>
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function today(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}

var n=new Date(),y=n.getFullYear(),a=new Date(y,0,1),b=new Date(y+1,0,1),pc=Math.floor((n-a)/(b-a)*100),left=Math.ceil((b-n)/864e5);
document.getElementById("y").textContent=y+", so far";document.getElementById("p").textContent=pc+"%";
setTimeout(function(){document.getElementById("f").style.width=pc+"%";},50);
document.getElementById("dl").textContent=left+" days left in "+y;
var W=document.getElementById("w");W.value=ld("woty","");
function show(){document.getElementById("wm").textContent=W.value?"this year is about: "+W.value.toLowerCase():"a gentle year, beautifully planned";}
W.oninput=function(){sv("woty",W.value);show();};show();
</script></body></html>
