<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#F6F1FB;--c1:#E8DDF4;--c2:#D8C6EB;--c3:#C0A5DE;--c4:#9F7CC4;--deep:#75549E;--dark:#4F3573;--mid:#7E5CA8;--w:#FCFAFF}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:Georgia,"Times New Roman",serif;color:var(--dark);display:flex;align-items:center;justify-content:center}
.c{text-align:center;padding:14px;width:100%;max-width:440px;box-sizing:border-box}
.k{font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.7}
.big{font-size:46px;margin:2px 0}
.it{font-style:italic;font-size:16px;color:var(--mid)}
.line{width:40px;height:1px;background:var(--c3);margin:10px auto}
input,select{font-family:inherit;font-size:14px;color:var(--dark);background:var(--w);border:1px solid var(--c3);border-radius:14px;padding:6px 10px;margin:3px;max-width:44%}
button{font-family:inherit;font-size:13px;border:1px solid var(--c3);background:var(--w);color:var(--dark);border-radius:20px;padding:6px 14px;margin:3px;cursor:pointer}
button.on{background:var(--c4);color:#fff;border-color:var(--c4)}
.row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}

</style></head><body><div class="c">
<div class="k" id="k">today's routine</div>
<div class="row" style="margin:6px 0"><button id="bam" class="on" onclick="mode('am')">☀️ morning</button><button id="bpm" onclick="mode('pm')">🌙 night</button></div>
<div id="l" style="text-align:left;display:inline-block;font-size:16px;line-height:2"></div>
<div class="line"></div><div class="it" id="s" style="font-size:14px"></div></div>
<script>
function sv(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function ld(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function p2(n){return n<10?"0"+n:n}

var R={am:["cleanser","toner","serum","moisturiser","sunscreen"],pm:["cleanser","toner","treatment","moisturiser","lip balm"]},cur=new Date().getHours()<16?"am":"pm";
function key(){return "routine-"+new Date().toDateString()+"-"+cur}
function st(){try{return JSON.parse(ld(key(),"[]"))}catch(e){return[]}}
function draw(){var d=st(),h="";R[cur].forEach(function(s,i){h+='<div><label style="cursor:pointer"><input type="checkbox" style="max-width:none;margin:0 8px 0 0" '+(d.indexOf(i)>-1?"checked":"")+' onchange="t('+i+')">'+s+'</label></div>'});
document.getElementById("l").innerHTML=h;document.getElementById("bam").className=cur=="am"?"on":"";document.getElementById("bpm").className=cur=="pm"?"on":"";
document.getElementById("s").textContent=d.length==R[cur].length?"all done. glowing. ✨":d.length+" of "+R[cur].length+" done"}
function t(i){var d=st(),j=d.indexOf(i);if(j>-1)d.splice(j,1);else d.push(i);sv(key(),JSON.stringify(d));draw()}
function mode(m){cur=m;draw()}draw();
</script></body></html>
