<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#FDF1F3;--c1:#F9DFE5;--c2:#F4C8D5;--c3:#E9A7BC;--c4:#D5819F;--deep:#A94F78;--dark:#7A3452;--mid:#B5587F;--w:#FFFAFB}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:Georgia,"Times New Roman",serif;color:var(--dark);display:flex;align-items:center;justify-content:center}
.c{text-align:center;padding:14px;width:100%;max-width:440px;box-sizing:border-box}
.k{font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.7}
.big{font-size:46px;margin:2px 0}
.it{font-style:italic;font-size:16px;color:var(--mid)}
.line{width:40px;height:1px;background:var(--c3);margin:10px auto}
input,select{font-family:inherit;font-size:14px;color:var(--dark);background:var(--w);border:1px solid var(--c3);border-radius:14px;padding:6px 10px;margin:3px;max-width:44%}
button{font-family:inherit;font-size:13px;border:1px solid var(--c3);background:var(--w);color:var(--dark);border-radius:20px;padding:6px 14px;margin:3px;cursor:pointer}
button.on{background:var(--c4);color:#fff;border-color:var(--c4)}
.row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}

</style></head><body><div class="c">
<div class="k">right now</div>
<div class="row" style="align-items:flex-start;gap:20px;margin-top:6px">
<div><div class="it" id="a1">you</div><div class="big" id="ta" style="font-size:34px">--</div><div class="it" id="da" style="font-size:12px"></div>
<select id="za" style="max-width:none;width:120px" onchange="chg()"></select></div>
<div style="font-size:28px;margin-top:22px">🤍</div>
<div><div class="it" id="b1">them</div><div class="big" id="tb" style="font-size:34px">--</div><div class="it" id="db" style="font-size:12px"></div>
<select id="zb" style="max-width:none;width:120px" onchange="chg()"></select></div></div>
<div class="line"></div><div class="it" id="gap" style="font-size:14px"></div></div>
<script>
function sv(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function ld(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function p2(n){return n<10?"0"+n:n}

var Z=["Asia/Kolkata","America/New_York","America/Chicago","America/Los_Angeles","Europe/London","Europe/Paris","Asia/Dubai","Asia/Singapore","Asia/Tokyo","Australia/Sydney","Pacific/Auckland","America/Toronto"];
function fill(id,def){var s=document.getElementById(id);Z.forEach(function(z){var o=document.createElement("option");o.value=z;o.textContent=z.split("/")[1].replace("_"," ");s.appendChild(o)});s.value=ld(id,def)}
function chg(){sv("za",document.getElementById("za").value);sv("zb",document.getElementById("zb").value);tick()}
function f(z){var n=new Date();return{t:n.toLocaleTimeString("en-US",{timeZone:z,hour:"numeric",minute:"2-digit"}),d:n.toLocaleDateString("en-US",{timeZone:z,weekday:"short"}),h:+n.toLocaleTimeString("en-GB",{timeZone:z,hour:"2-digit",hour12:false}).slice(0,2),o:new Date(n.toLocaleString("en-US",{timeZone:z}))}}
function mood(h){return h<6?"🌙 asleep":h<9?"☕ waking up":h<18?"☀️ daytime":h<22?"🌆 evening":"🌙 night"}
function tick(){var a=f(document.getElementById("za").value),b=f(document.getElementById("zb").value);
document.getElementById("ta").textContent=a.t;document.getElementById("tb").textContent=b.t;
document.getElementById("da").textContent=a.d+" · "+mood(a.h);document.getElementById("db").textContent=b.d+" · "+mood(b.h);
var diff=Math.round((b.o-a.o)/36e5*2)/2;document.getElementById("gap").textContent=diff==0?"same time. lucky you.":Math.abs(diff)+" hours "+(diff>0?"ahead of you":"behind you");}
fill("za","Asia/Kolkata");fill("zb","America/New_York");tick();setInterval(tick,15000);
</script></body></html>
