<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#FDF1F3;--c1:#F9DFE5;--c2:#F4C8D5;--c3:#E9A7BC;--c4:#D5819F;--deep:#A94F78;--dark:#7A3452;--mid:#B5587F;--w:#FFFAFB}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:Georgia,"Times New Roman",serif;color:var(--dark);display:flex;align-items:center;justify-content:center}
.c{text-align:center;padding:14px;width:100%;max-width:440px;box-sizing:border-box}
.k{font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.7}
.big{font-size:46px;margin:2px 0}
.it{font-style:italic;font-size:16px;color:var(--mid)}
.line{width:40px;height:1px;background:var(--c3);margin:10px auto}
input,select{font-family:inherit;font-size:14px;color:var(--dark);background:var(--w);border:1px solid var(--c3);border-radius:14px;padding:6px 10px;margin:3px;max-width:44%}
button{font-family:inherit;font-size:13px;border:1px solid var(--c3);background:var(--w);color:var(--dark);border-radius:20px;padding:6px 14px;margin:3px;cursor:pointer}
button.on{background:var(--c4);color:#fff;border-color:var(--c4)}
.row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}

</style></head><body><div class="c">
<div class="k">until we're together</div><div class="big" id="n">--</div><div class="it" id="u">days</div>
<div class="it" style="font-size:22px;margin:8px 0" id="h">🤍🤍🤍🤍🤍</div><div class="line"></div>
<div class="row"><input type="date" id="d"><button onclick="setd()">save</button></div></div>
<script>
function sv(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function ld(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function p2(n){return n<10?"0"+n:n}

function setd(){sv("visit",document.getElementById("d").value);show()}
function show(){var v=ld("visit","");if(v)document.getElementById("d").value=v;if(!v){document.getElementById("u").textContent="pick your next visit date";return}
var left=Math.ceil((new Date(v+"T00:00:00")-new Date())/864e5);
if(left<=0){document.getElementById("n").textContent="🎉";document.getElementById("u").textContent=left==0?"today. go hug them.":"you're together (or pick a new date)";document.getElementById("h").textContent="💗💗💗💗💗";return}
document.getElementById("n").textContent=left;document.getElementById("u").textContent=left==1?"day to go":"days to go";
var w=Math.min(5,Math.max(0,Math.ceil(left/7))),a=["🤍🤍🤍🤍🤍","💗🤍🤍🤍🤍","💗💗🤍🤍🤍","💗💗💗🤍🤍","💗💗💗💗🤍","💗💗💗💗💗"];
document.getElementById("h").textContent=a[5-w];}
show();
</script></body></html>
