<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#F6F1FB;--c1:#E8DDF4;--c2:#D8C6EB;--c3:#C0A5DE;--c4:#9F7CC4;--deep:#75549E;--dark:#4F3573;--mid:#7E5CA8;--w:#FCFAFF}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:Georgia,"Times New Roman",serif;color:var(--dark);display:flex;align-items:center;justify-content:center}
.c{text-align:center;padding:14px;width:100%;max-width:440px;box-sizing:border-box}
.k{font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.7}
.big{font-size:46px;margin:2px 0}
.it{font-style:italic;font-size:16px;color:var(--mid)}
.line{width:40px;height:1px;background:var(--c3);margin:10px auto}
input,select{font-family:inherit;font-size:14px;color:var(--dark);background:var(--w);border:1px solid var(--c3);border-radius:14px;padding:6px 10px;margin:3px;max-width:44%}
button{font-family:inherit;font-size:13px;border:1px solid var(--c3);background:var(--w);color:var(--dark);border-radius:20px;padding:6px 14px;margin:3px;cursor:pointer}
button.on{background:var(--c4);color:#fff;border-color:var(--c4)}
.row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}

</style></head><body><div class="c">
<div class="k">outfit shuffler</div>
<div class="row"><select id="v"><option>everyday</option><option>work</option><option>date night</option><option>weekend</option><option>travel</option></select><select id="s"><option>warm</option><option>mild</option><option>cold</option></select></div>
<div class="it" id="o" style="font-size:18px;line-height:1.5;margin:12px 0;min-height:80px">pick a vibe and shuffle</div>
<button class="on" onclick="sh()">shuffle ✨</button></div>
<script>
function sv(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function ld(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function p2(n){return n<10?"0"+n:n}

var T={warm:["linen shirt","flowy dress","cotton tee","light shorts","tank top","midi skirt"],mild:["knit top","straight jeans","light cardigan","trousers","blouse","denim jacket"],cold:["chunky sweater","wool coat","thermal layer","dark jeans","knit dress","scarf and boots"]};
var B={"everyday":["white sneakers","a tote bag","small hoops"],work:["loafers","a structured bag","a simple watch"],"date night":["heels or boots","a mini bag","statement earrings"],weekend:["comfy sneakers","a crossbody","sunglasses"],travel:["slip-ons","a roomy tote","a light scarf"]};
function r(a){return a[Math.floor(Math.random()*a.length)]}
function sh(){var s=document.getElementById("s").value,v=document.getElementById("v").value,a=T[s],x=r(a),y=r(a);while(y==x)y=r(a);
document.getElementById("o").innerHTML=x+" + "+y+"<br>with "+r(B[v][0].split("|"))+", "+B[v][1]+" and "+B[v][2];}
</script></body></html>
