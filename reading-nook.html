<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>reading nook</title>
<style>
html,body{margin:0;height:100%;background:#F5EEE6;}
body{font-family:Georgia,"Times New Roman",serif;color:#6F4E37;display:flex;align-items:center;justify-content:center;}
.c{text-align:center;padding:14px 12px;max-width:400px}
.k{font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.65}
.q{font-style:italic;font-size:17px;line-height:1.45;margin:8px 0 4px}
.a{font-size:12px;letter-spacing:1px;color:#9C6644}
.line{width:40px;height:1px;background:#C8A98B;margin:12px auto}
.t{font-size:44px;margin:2px 0 6px}
.l{font-style:italic;font-size:14px;opacity:.85}
button{font-family:inherit;font-size:13px;border:1px solid #C8A98B;background:#FFF9F3;color:#6F4E37;border-radius:20px;padding:5px 12px;margin:3px;cursor:pointer}
button.on{background:#B08968;color:#fff;border-color:#B08968}
.p{font-size:13px;margin-top:6px}
.p button{padding:2px 9px}
</style></head>
<body><div class="c">
<div class="k">a line to read slowly</div>
<div class="q" id="q"></div>
<div class="a" id="a"></div>
<div class="line"></div>
<div class="l" id="l">cozy up, lovely</div>
<div class="t" id="t">20:00</div>
<div>
<button id="b1" onclick="setM(10,this)">10</button><button id="b2" class="on" onclick="setM(20,this)">20</button><button id="b3" onclick="setM(40,this)">40 min</button>
</div>
<div><button id="go" onclick="tog()">start reading</button><button onclick="rst()">reset</button></div>
<div class="p">pages today: <button onclick="pg(-1)">-</button> <b id="n">0</b> <button onclick="pg(1)">+</button> <button onclick="pg(10)">+10</button></div>
</div>
<script>
var Q=[["I declare after all there is no enjoyment like reading!","Jane Austen, Pride and Prejudice"],["I am no bird; and no net ensnares me.","Charlotte Brontë, Jane Eyre"],["I'm not afraid of storms, for I'm learning how to sail my ship.","Louisa May Alcott, Little Women"],["Isn't it splendid to think of all the things there are to find out about?","L. M. Montgomery, Anne of Green Gables"],["Whatever our souls are made of, his and mine are the same.","Emily Brontë, Wuthering Heights"],["If you look the right way, you can see that the whole world is a garden.","Frances Hodgson Burnett, The Secret Garden"],["There is no charm equal to tenderness of heart.","Jane Austen, Emma"],["Tomorrow is always fresh, with no mistakes in it yet.","L. M. Montgomery, Anne of Green Gables"],["I would always rather be happy than dignified.","Charlotte Brontë, Jane Eyre"],["You pierce my soul. I am half agony, half hope.","Jane Austen, Persuasion"],["So we beat on, boats against the current.","F. Scott Fitzgerald, The Great Gatsby"]];
var d=new Date(),doy=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5),qi=doy%Q.length;
document.getElementById("q").textContent="“"+Q[qi][0]+"”";document.getElementById("a").textContent=Q[qi][1];
var len=20*60,left=len,run=false,iv=null,pages=0,key="rn-"+d.toDateString();
try{pages=parseInt(localStorage.getItem(key)||"0",10)||0;}catch(e){}
function show(){var m=Math.floor(left/60),s=left%60;document.getElementById("t").textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s;document.getElementById("n").textContent=pages;}
function setM(n,el){len=n*60;left=len;stop();["b1","b2","b3"].forEach(function(i){document.getElementById(i).className="";});el.className="on";document.getElementById("l").textContent="cozy up, lovely";show();}
function stop(){run=false;clearInterval(iv);document.getElementById("go").textContent="start reading";}
function tog(){if(run){stop();return;}run=true;document.getElementById("go").textContent="pause";
iv=setInterval(function(){left--;show();if(left<=0){stop();document.getElementById("l").textContent="lovely. one more chapter?";left=len;show();}},1000);}
function rst(){stop();left=len;show();}
function pg(k){pages=Math.max(0,pages+k);try{localStorage.setItem(key,String(pages));}catch(e){}show();}
show();
</script></body></html>
