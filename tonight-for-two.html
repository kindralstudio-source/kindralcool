<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tonight, for two</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBEFF2;--c1:#F6D9E0;--c2:#EFC3CF;--c3:#E3A3B6;--c4:#D4829B;--ink:#7A3B52;--mid:#A8566F;--card:#FFFAFB}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);font-family:Lora,Georgia,'Times New Roman',serif;color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:22px 18px 20px;position:relative;overflow:hidden}
.arch{position:absolute;bottom:0;border-radius:200px 200px 0 0;pointer-events:none}
.a1{left:-40px;width:110px;height:150px;background:var(--c1)}
.a2{right:-30px;width:90px;height:110px;background:var(--c2)}
header{text-align:center;position:relative}
h1{font-style:italic;font-weight:500;font-size:30px;letter-spacing:.2px}
.sub{font-size:10px;letter-spacing:.32em;color:var(--mid);margin-top:6px}
.rule{width:44px;height:2px;background:var(--c3);margin:11px auto 14px;border-radius:2px}
nav{display:flex;justify-content:center;gap:6px;position:relative;margin-bottom:14px}
nav button{font:inherit;font-size:13px;font-style:italic;background:transparent;border:1px solid var(--c2);color:var(--mid);padding:6px 16px;border-radius:999px;cursor:pointer;transition:.2s}
nav button.on{background:var(--c4);border-color:var(--c4);color:#fff}
.panel{display:none;position:relative}.panel.on{display:block}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin-bottom:8px}
.lab{font-size:9.5px;letter-spacing:.26em;color:var(--mid);width:100%;text-align:center;margin:6px 0 2px}
.chip{font:inherit;font-size:12.5px;background:var(--card);border:1px solid var(--c2);color:var(--ink);padding:5px 13px;border-radius:999px;cursor:pointer;transition:.18s}
.chip.on{background:var(--c3);border-color:var(--c3);color:#fff}
.stage{perspective:1100px;margin:14px auto 12px;height:216px;max-width:400px}
.card{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;background:var(--card);box-shadow:0 14px 32px -14px rgba(122,59,82,.35),0 0 0 1px var(--c1);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 26px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .tag{font-size:9.5px;letter-spacing:.28em;color:var(--c4);margin-bottom:10px}
.face .big{font-style:italic;font-size:22px;line-height:1.3;font-weight:500}
.face .how{font-size:13px;line-height:1.5;color:var(--mid);margin-top:10px}
.face .meta{font-size:11px;color:var(--mid);margin-top:12px;letter-spacing:.06em}
.face.front .motif{width:54px;height:54px;border-radius:30px 30px 0 0;background:var(--c3);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.face.front .big{font-size:19px;color:var(--mid)}
.acts{display:flex;justify-content:center;gap:10px;position:relative}
.btn{font:inherit;font-size:14px;font-style:italic;border:none;cursor:pointer;padding:10px 22px;border-radius:999px;transition:.2s}
.btn.p{background:var(--c4);color:#fff;box-shadow:0 8px 18px -8px rgba(212,130,155,.9)}
.btn.p:active{transform:scale(.97)}
.btn.s{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--c2)}
.btn.s.kept{background:var(--c1);color:var(--ink);box-shadow:0 0 0 1px var(--c3)}
.note{text-align:center;font-size:12px;font-style:italic;color:var(--mid);margin-top:10px;min-height:16px}
.list{list-style:none;display:flex;flex-direction:column;gap:8px;max-width:440px;margin:0 auto}
.list li{background:var(--card);border-radius:16px;padding:11px 14px;box-shadow:0 0 0 1px var(--c1);display:flex;gap:10px;align-items:flex-start}
.list .t{flex:1;font-size:14px;line-height:1.4}.list .k{font-size:9px;letter-spacing:.22em;color:var(--c4);display:block;margin-bottom:3px}
.list button{font:inherit;background:none;border:none;color:var(--c3);cursor:pointer;font-size:18px;line-height:1}
.empty{text-align:center;font-style:italic;color:var(--mid);font-size:13.5px;line-height:1.6;padding:26px 10px}
</style></head><body>
<div class="wrap">
<div class="arch a1"></div><div class="arch a2"></div>
<header><h1>tonight, for two</h1><div class="sub">DECIDE · ASK · KEEP</div><div class="rule"></div></header>
<nav><button data-p="decide" class="on">Decide</button><button data-p="ask">Ask</button><button data-p="keep">Keepers</button></nav>

<section class="panel on" id="p-decide">
<div class="lab">THE MOOD</div><div class="row" data-f="mood"></div>
<div class="lab">THE BUDGET</div><div class="row" data-f="budget"></div>
<div class="lab">THE TIME</div><div class="row" data-f="time"></div>
<div class="stage"><div class="card" id="dcard">
<div class="face front"><div class="motif"><svg width="26" height="26" viewBox="0 0 26 26"><path d="M13 22C4 15 3 9 7.5 6.5C10.5 5 12.5 7 13 8.5C13.5 7 15.5 5 18.5 6.5C23 9 22 15 13 22Z" fill="#FBEFF2"/></svg></div><div class="big">what shall we do tonight?</div></div>
<div class="face back"><div class="tag" id="dtag"></div><div class="big" id="dtitle"></div><div class="how" id="dhow"></div><div class="meta" id="dmeta"></div></div>
</div></div>
<div class="acts"><button class="btn p" id="draw">Draw a card</button><button class="btn s" id="dkeep">Keep it</button></div>
<div class="note" id="dnote"></div>
</section>

<section class="panel" id="p-ask">
<div class="lab">HOW DEEP</div><div class="row" data-f="depth"></div>
<div class="stage"><div class="card" id="acard">
<div class="face front"><div class="motif"><svg width="26" height="26" viewBox="0 0 26 26"><path d="M13 3L15 11L23 13L15 15L13 23L11 15L3 13L11 11Z" fill="#FBEFF2"/></svg></div><div class="big">one question, no phones</div></div>
<div class="face back"><div class="tag" id="atag"></div><div class="big" id="aq"></div></div>
</div></div>
<div class="acts"><button class="btn p" id="turn">Turn a card</button><button class="btn s" id="akeep">Keep it</button></div>
<div class="note" id="anote">Take turns. Answer first, then ask it back.</div>
</section>

<section class="panel" id="p-keep"><ul class="list" id="klist"></ul></section>
</div>
<script>
var IDEAS=[
["Pancakes for dinner","Flour everywhere, phones away, one silly topping each.","cozy",0,1],
["Blanket fort and a movie","Build it properly. Pillows count as walls.","cozy",0,2],
["Bake something from scratch","Pick a recipe neither of you has tried. Eat it warm.","cozy",1,2],
["Slow Sunday playlist","Make one together, add a song for each other, dance in the kitchen.","cozy",0,1],
["Dessert for dinner","Order only sweet things and call it a tasting menu.","cozy",1,1],
["Board game league","Best of five. Loser does the dishes.","playful",0,2],
["Cook a country neither of you has visited","Pick a dish, a playlist and a drink to match.","playful",1,2],
["Photo booth night","Take five silly strips with props from around the house.","playful",0,1],
["Mini golf or bowling","Keep score. The winner picks the next date.","playful",1,2],
["Karaoke at home","Each of you picks three songs for the other.","playful",0,2],
["Arcade hour","Roll of coins each, one shared high score to beat.","playful",1,1],
["Candlelit dinner at home","Real plates, one candle, one question each course.","romantic",1,2],
["Stargazing with something warm","Find a dark spot, bring a blanket and a flask.","romantic",0,2],
["Sunset walk, no destination","Leave the phone, hold hands, end somewhere with a view.","romantic",0,1],
["Write each other a letter","Ten minutes each, then read them out loud.","romantic",0,1],
["Dress up and go somewhere nice","Dinner, dessert, dancing, as long as you both dress up.","romantic",2,3],
["Recreate your first date","Same place if you can, same order if you dare.","romantic",1,2],
["Picnic somewhere new","Bring more food than you need and a blanket.","romantic",1,2],
["Spa night at home","Face masks, music, foot rubs, no talking about work.","romantic",1,2],
["Pottery or painting class","Make something for each other, even if it is wonky.","adventurous",2,2],
["Day trip to a town you have never been","Pick one by closing your eyes on a map.","adventurous",1,3],
["Hike with a good coffee at the top","Pick the trail together and carry the snacks.","adventurous",0,3],
["Try a cuisine you cannot pronounce","Ask the staff what they would order.","adventurous",1,2],
["Rent bikes and get a little lost","Stop at the first place that smells good.","adventurous",1,3],
["Farmers market breakfast","Buy whatever looks best and make lunch from it.","adventurous",1,2],
["Sunrise breakfast","Set the alarm, bring a flask, watch the sky change.","adventurous",0,2],
["Museum with a rule","Each pick the one piece you would take home.","adventurous",1,2],
["Late night drive","One playlist, one snack, no map.","adventurous",0,2],
["Plan a trip over dinner","Pick a place, a month and one thing you will do.","playful",1,2],
["Cook the same dish, separately","Taste test at the end. Be honest.","playful",1,2],
["Read to each other","One chapter or one poem each, in bed.","cozy",0,1],
["Rainy day tea and a puzzle","Start the puzzle, leave it out all week.","cozy",1,2],
["Look through old photos","Pick your three favorites and say why.","cozy",0,2],
["Make a dream list","Ten things for the next year, five minutes each.","cozy",0,1],
["Wine and cheese tasting at home","Rate everything out of ten, argue gently.","romantic",2,2],
["Go to a live show","Small venue, close to the stage.","adventurous",2,2],
["Outdoor movie night","Projector or laptop, blankets, popcorn.","cozy",1,2],
["Do a small thing for a stranger together","Pay for a coffee, leave a kind note.","playful",1,1],
["Surprise day","One of you plans everything. The other only knows what to wear.","adventurous",2,3],
["Sleep in, then slow breakfast","Nothing before ten. Everything gentle.","cozy",1,2],
["Cocktails you invent","Three ingredients, one name for each drink.","playful",1,2],
["Love language swap","Each do something for the other in their language.","romantic",0,1],
["Beach or lake day","Swim, nap, repeat. Pack the good snacks.","adventurous",1,3],
["Watch the sunset from the rooftop","Bring dessert and stay until it is dark.","romantic",0,2]
];
var ASKS=[
["light","What is a small thing I did this week that made you smile?"],
["light","What is your comfort meal when the day goes badly?"],
["light","If we had a free Saturday, what would your perfect one look like?"],
["light","Which song makes you think of us?"],
["light","What is something silly you have never told me you love?"],
["light","What is your favorite memory from the last year?"],
["light","If we could teleport anywhere for dinner tonight, where would we go?"],
["light","What is one tiny habit of mine you secretly like?"],
["light","What did you want to be when you were ten?"],
["light","What is the best compliment you have ever received?"],
["light","What is one thing we should do more often?"],
["light","Which meal would you cook for me if you had all the time?"],
["deeper","When do you feel most loved by me?"],
["deeper","What is something you are proud of that you rarely say out loud?"],
["deeper","What helps you most when you are stressed, and what makes it worse?"],
["deeper","What is one thing you want us to protect, no matter how busy life gets?"],
["deeper","What did you learn about love from the home you grew up in?"],
["deeper","Is there something you wish I asked you more?"],
["deeper","What is a fear you carry that I could help hold?"],
["deeper","How do you like to be comforted when you are sad?"],
["deeper","What does a good weekday evening look like for us?"],
["deeper","What is a moment in our story you think about often?"],
["deeper","What is one way I could make you feel more supported right now?"],
["deeper","What does home mean to you?"],
["deepest","Where do you see us in ten years, and what are we doing on an ordinary Tuesday?"],
["deepest","What is a dream you have quietly given up on, and do you want it back?"],
["deepest","What is the hardest thing we have been through, and what did it teach us?"],
["deepest","What do you need from me that you have not asked for?"],
["deepest","What would you want us to say to each other every day?"],
["deepest","What are you most afraid of losing?"],
["deepest","What would you tell our younger selves on the day we met?"],
["deepest","What is one thing you want to forgive, in yourself or in us?"],
["deepest","How do you want us to grow old together?"],
["deepest","What part of you do you think I understand least?"],
["deepest","If this year were a chapter, what would you title it?"],
["deepest","What is one promise you want to make to me today?"]
];
var KEY='couples_os_tonight_v1',S={tab:'decide',f:{mood:'',budget:'',time:'',depth:''},keep:[],cur:null,acur:null};
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.keep)S.keep=o.keep;if(o&&o.f)for(var k in S.f)if(o.f[k]!==undefined)S.f[k]=o.f[k];if(o&&o.tab)S.tab=o.tab}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({keep:S.keep,f:S.f,tab:S.tab}))}catch(e){}}
var OPTS={mood:[['cozy','cozy'],['romantic','romantic'],['playful','playful'],['adventurous','adventurous']],budget:[['0','free'],['1','$'],['2','$$']],time:[['1','an hour'],['2','an evening'],['3','half a day']],depth:[['light','light'],['deeper','deeper'],['deepest','deepest']]};
function $(s){return document.querySelector(s)}
function chips(){var rows=document.querySelectorAll('.row[data-f]');Array.prototype.forEach.call(rows,function(r){var f=r.getAttribute('data-f');r.innerHTML='';OPTS[f].forEach(function(o){var b=document.createElement('button');b.className='chip'+(S.f[f]===o[0]?' on':'');b.textContent=o[1];b.onclick=function(){S.f[f]=(S.f[f]===o[0]?'':o[0]);save();chips()};r.appendChild(b)})})}
function show(t){S.tab=t;save();['decide','ask','keep'].forEach(function(p){$('#p-'+p).className='panel'+(p===t?' on':'')});var bs=document.querySelectorAll('nav button');for(var i=0;i<bs.length;i++)bs[i].className=bs[i].getAttribute('data-p')===t?'on':'';if(t==='keep')renderKeep()}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function flipTo(card,fill){var c=$(card);if(c.className.indexOf('flip')>-1){c.className='card';setTimeout(function(){fill();c.className='card flip'},330)}else{fill();c.className='card flip'}}
function isKept(t){return S.keep.some(function(k){return k.t===t})}
function paintKeep(btn,t){var b=$(btn);var k=t&&isKept(t);b.className='btn s'+(k?' kept':'');b.textContent=k?'Kept':'Keep it'}
$('#draw').onclick=function(){var f=S.f;var pool=IDEAS.filter(function(i){return(!f.mood||i[2]===f.mood)&&(!f.budget||String(i[3])===f.budget)&&(!f.time||String(i[4])===f.time)});
if(!pool.length){$('#dnote').textContent='Nothing fits all three yet. Loosen one filter.';return}
var n=pick(pool);if(pool.length>1&&S.cur&&n===S.cur)n=pick(pool);S.cur=n;$('#dnote').textContent=pool.length+' idea'+(pool.length>1?'s':'')+' match';
flipTo('#dcard',function(){$('#dtag').textContent=n[2].toUpperCase();$('#dtitle').textContent=n[0];$('#dhow').textContent=n[1];$('#dmeta').textContent=['free','$','$$'][n[3]]+'  ·  '+['','an hour','an evening','half a day'][n[4]]});paintKeep('#dkeep',n[0])};
$('#dkeep').onclick=function(){var n=S.cur;if(!n)return;toggle({t:n[0],k:'IDEA',s:n[1]});paintKeep('#dkeep',n[0])};
$('#turn').onclick=function(){var d=S.f.depth;var pool=ASKS.filter(function(q){return!d||q[0]===d});var q=pick(pool);if(pool.length>1&&S.acur&&q===S.acur)q=pick(pool);S.acur=q;
flipTo('#acard',function(){$('#atag').textContent=q[0].toUpperCase();$('#aq').textContent=q[1]});paintKeep('#akeep',q[1])};
$('#akeep').onclick=function(){var q=S.acur;if(!q)return;toggle({t:q[1],k:'QUESTION',s:''});paintKeep('#akeep',q[1])};
function toggle(o){var i=-1;S.keep.forEach(function(k,x){if(k.t===o.t)i=x});if(i>-1)S.keep.splice(i,1);else S.keep.unshift(o);save()}
function renderKeep(){var u=$('#klist');u.innerHTML='';if(!S.keep.length){u.innerHTML='<li style="display:block;background:none;box-shadow:none"><div class="empty">Nothing kept yet.<br>Tap Keep it on an idea or a question you want to come back to.</div></li>';return}
S.keep.forEach(function(k,i){var li=document.createElement('li');li.innerHTML='<div class="t"><span class="k">'+k.k+'</span>'+esc(k.t)+(k.s?'<div style="font-size:12px;color:#A8566F;margin-top:3px">'+esc(k.s)+'</div>':'')+'</div>';var b=document.createElement('button');b.innerHTML='&times;';b.title='Remove';b.onclick=function(){S.keep.splice(i,1);save();renderKeep()};li.appendChild(b);u.appendChild(li)})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var nb=document.querySelectorAll('nav button');for(var i=0;i<nb.length;i++)nb[i].onclick=function(){show(this.getAttribute('data-p'))};
load();chips();show(S.tab);
</script></body></html>
