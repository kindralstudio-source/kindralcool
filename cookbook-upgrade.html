<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cookbook OS · Kindral Studio</title>
<style>
  :root{
    --bg:#F5EEE6; --card:#FFF9F3; --c1:#E3CDB8; --c2:#D9C2A7; --c3:#C8A98B; --c4:#B08968;
    --deep:#8A6A4F; --dark:#6F4E37; --mid:#9C6644;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:transparent}
  body{font-family:Georgia,"Times New Roman",serif;color:var(--dark);padding:6px;container-type:inline-size}
  a.card{
    display:flex;align-items:stretch;gap:0;height:100%;min-height:150px;
    background:var(--bg);border:1px solid var(--c1);border-radius:18px;overflow:hidden;
    text-decoration:none;color:inherit;position:relative;
    transition:box-shadow .2s ease, transform .2s ease;
  }
  a.card:hover{box-shadow:0 8px 24px rgba(111,78,55,.12);transform:translateY(-1px)}
  /* image panel: whole image, never cropped */
  .shot{
    flex:0 0 34%;max-width:440px;background:var(--c1);
    display:flex;align-items:center;justify-content:center;padding:14px;position:relative;
  }
  .shot::before{ /* soft arch behind the image */
    content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    width:62%;height:82%;background:var(--c2);border-radius:999px 999px 0 0;
  }
  .shot img{
    position:relative;max-width:100%;max-height:100%;width:auto;height:auto;
    object-fit:contain;border-radius:10px;box-shadow:0 6px 18px rgba(111,78,55,.18);display:block;
  }
  .body{flex:1;display:flex;align-items:center;gap:28px;padding:18px 30px;min-width:0}
  .text{flex:1;min-width:0}
  .eyebrow{font-size:11px;letter-spacing:.32em;color:var(--mid);text-transform:uppercase}
  h1{font-style:italic;font-weight:400;font-size:clamp(22px,3.2vw,38px);line-height:1.1;margin:6px 0 6px}
  .line{font-size:clamp(13px,1.35vw,16px);color:var(--deep);line-height:1.45;max-width:62ch}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--c1);color:var(--deep);white-space:nowrap}
  .cta{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px}
  .btn{
    font-family:Georgia,serif;font-size:15px;letter-spacing:.04em;white-space:nowrap;
    background:var(--dark);color:var(--card);padding:13px 24px;border-radius:999px;
    transition:background .2s ease;
  }
  a.card:hover .btn{background:var(--mid)}
  .note{font-size:11px;color:var(--c4);font-style:italic;white-space:nowrap}
  .spark{position:absolute;width:14px;height:14px;fill:var(--c4)}
  /* shrink: medium widths */
  @container (max-width:820px){
    .chips .chip:nth-child(n+4){display:none}
    .body{gap:18px;padding:14px 20px}
    .shot{flex-basis:30%}
  }
  /* shrink: narrow widths, stack text and button, keep image */
  @container (max-width:600px){
    .body{flex-direction:column;align-items:flex-start;gap:12px}
    .chips{display:none}
    .shot{flex-basis:36%;padding:10px}
    .note{display:none}
  }
  @container (max-width:420px){
    a.card{flex-direction:column;height:auto}
    .shot{flex-basis:auto;max-width:none;height:150px}
    .cta{align-self:stretch}
    .btn{text-align:center}
  }
</style>
</head>
<body>
<a class="card" href="https://kindral.gumroad.com/l/cookbook-meal-planner" target="_blank" rel="noopener">
  <div class="shot">
    <img src="https://public-files.gumroad.com/p2hmqnczl8d1sjcymgzn5rh4drbg" alt="Cookbook OS preview">
  </div>
  <div class="body">
    <div class="text">
      <div class="eyebrow">Kindral Studio · The full kitchen</div>
      <h1>Ready for more? Get Cookbook OS</h1>
      <p class="line">Your recipes, meal plan, grocery list and pantry in one place, with a built-in kitchen timer.</p>
      <div class="chips">
        <span class="chip">Recipe Book</span>
        <span class="chip">Grocery List</span>
        <span class="chip">Pantry</span>
        <span class="chip">Cooking Log</span>
        <span class="chip">Dine-Out Book</span>
        <span class="chip">Multi-timer</span>
      </div>
    </div>
    <div class="cta">
      <span class="btn">See Cookbook OS &rarr;</span>
      <span class="note">instant Notion download</span>
    </div>
  </div>
  <svg class="spark" style="right:18px;top:14px" viewBox="0 0 16 16"><path d="M8 0l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>
</a>
</body>
</html>
