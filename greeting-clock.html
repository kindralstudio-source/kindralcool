<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#F5EEE6;}
body{font-family:Georgia,"Times New Roman",serif;color:#6F4E37;display:flex;align-items:center;justify-content:center;}
.card{text-align:center;padding:18px 12px;}
.g{font-style:italic;font-size:18px;opacity:.9}
.t{font-size:46px;letter-spacing:1px;margin:2px 0}
.d{font-size:14px;text-transform:lowercase;letter-spacing:2px;opacity:.75}
.line{width:40px;height:1px;background:#C8A98B;margin:12px auto}
.a{font-style:italic;font-size:15px;color:#9C6644;max-width:320px;margin:0 auto;line-height:1.4}
</style></head>
<body><div class="card">
<div class="g" id="g"></div>
<div class="t" id="t"></div>
<div class="d" id="d"></div>
<div class="line"></div>
<div class="a" id="a"></div>
</div>
<script>
var A=["I am allowed to take up space.","Slow progress is still progress.","I choose peace over perfect.","My pace is the right pace.","Small steps, every single day.","I am becoming who I want to be.","Rest is productive too.","I trust the timing of my life.","Today I show up for myself.","I am proud of how far I have come.","Soft heart, strong mind.","I deserve the love I give others.","Good things are coming my way.","I can do hard things, gently.","My home is calm, my mind is calm.","I let go of what I cannot control.","I am enough, exactly as I am.","Every day is a fresh page.","I romanticize my ordinary life.","Discipline is a love letter to future me.","I am growing, even when it is quiet.","Joy is allowed to be simple.","I keep promises to myself.","My energy is precious. I spend it wisely.","Done is better than perfect.","I bloom in my own season.","Today I choose to be kind to myself.","I have everything I need to begin.","Calm is my superpower.","Little by little, a little becomes a lot."];
function p(n){return n<10?"0"+n:n}
function tick(){var n=new Date(),h=n.getHours();
document.getElementById("g").textContent=h<12?"good morning, lovely":h<17?"good afternoon, lovely":"good evening, lovely";
var hh=h%12||12;document.getElementById("t").textContent=hh+":"+p(n.getMinutes())+(h<12?" am":" pm");
document.getElementById("d").textContent=n.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
var s=new Date(n.getFullYear(),0,0),doy=Math.floor((n-s)/864e5);
document.getElementById("a").textContent="\u201C"+A[doy%A.length]+"\u201D";}
tick();setInterval(tick,10000);
</script></body></html>
